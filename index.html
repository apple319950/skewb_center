<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Skewb EG2 center recognition trainer" />
    <meta name="theme-color" content="#e7f3ec" />
    <title>Skewb EG2 Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="page-wrap nav-row">
        <h2 class="resource-title"><a href="./"><i></i>Skewb Resources</a></h2>
        <div class="nav-links" aria-label="Main navigation">
          <a href="./">Home</a>
          <a href="#options">About</a>
          <a class="active" href="#trainer">Trainer</a>
          <a href="#options">Layer Solver</a>
        </div>
        <div class="nav-actions">
          <a class="github-link" href="https://github.com/apple319950/skewb_center" target="_blank" rel="noreferrer">GitHub</a>
          <button id="theme-button" class="pill-button" type="button">Auto</button>
        </div>
      </nav>
    </header>

    <main id="trainer" class="page-wrap main-content">
      <section class="island-shell">
        <div class="title-row">
          <h1>Skewb Trainer</h1>
          <button id="mute-button" class="pill-button" type="button">Mute</button>
        </div>

        <h2 class="trainer-title">EG2 Center Trainer</h2>

        <div class="trainer-row">
          <section class="visual-column" aria-label="Question">
            <div id="score-text">0/0 answered correctly</div>
            <button id="give-up" class="pill-button give-up" type="button">I give up</button>
            <div class="skewb-box">
              <svg id="skewb-svg" viewBox="0 0 160 140" role="img" aria-label="Skewb EG2 case"></svg>
            </div>
          </section>

          <section class="answers-column" aria-label="Answers">
            <div id="answer-buttons" class="answer-list"></div>
          </section>

          <section id="options" class="options-column">
            <p><a href="https://edogaki.github.io/skewb-resources/trainer/" target="_blank" rel="noreferrer">Original NS Center Trainer by edogaki</a></p>
            <p><a href="https://github.com/mihlefeld/Alg-Trainers/tree/master/Skewb-NS2-Trainer" target="_blank" rel="noreferrer">EG2 case data reference</a></p>

            <form id="options-form">
              <h3>Options</h3>

              <label class="option-line">
                <input type="radio" name="trainerMode" value="full" checked />
                <span>Show Full 16 EG2 cases</span>
              </label>
              <label class="option-line">
                <input type="radio" name="trainerMode" value="basic" />
                <span>Show Basic 9 EG2 families</span>
              </label>
              <br />

              <label class="option-line">
                <input id="show-corners" type="checkbox" checked />
                <span>Show EG2 Corner Colors</span>
              </label>
              <label class="option-line">
                <input id="random-colors" type="checkbox" checked />
                <span>Random Color Orientation</span>
              </label>
              <br />

              <label class="option-line">
                <input type="radio" name="viewOrientation" value="updown" checked />
                <span>Up-down Orientation</span>
              </label>
              <label class="option-line">
                <input type="radio" name="viewOrientation" value="side1" />
                <span>Sideways Orientation 1</span>
              </label>
              <label class="option-line">
                <input type="radio" name="viewOrientation" value="side2" />
                <span>Sideways Orientation 2</span>
              </label>
              <br />

              <button id="keybind-toggle" class="pill-button" type="button">Show Keybinds</button>
            </form>
          </section>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="page-wrap footer-row">
        <p>EG2 Center Trainer · GitHub Pages</p>
        <p>EG2 Ori cases 132–147</p>
      </div>
    </footer>
  </body>
</html>
