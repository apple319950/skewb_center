<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>EG2 Center Trainer</title>
  <style>
:root {
  --bg: #f7fbfb;
  --surface: #ffffff;
  --surface-2: #f1f7f7;
  --ink: #142a2d;
  --muted: #547176;
  --line: #c8d9da;
  --line-heavy: #79999d;
  --accent: #0f6f73;
  --error-bg: #ffd9d9;
  --success-bg: #cff1d5;
  --shadow: 0 14px 40px rgba(28, 71, 76, 0.08);
}

html[data-theme="dark"] {
  --bg: #101819;
  --surface: #172224;
  --surface-2: #1d2b2d;
  --ink: #eaf5f5;
  --muted: #a9c0c2;
  --line: #34494c;
  --line-heavy: #789295;
  --accent: #83d7dc;
  --error-bg: #5d2727;
  --success-bg: #1d5530;
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
}

@media (prefers-color-scheme: dark) {
  html[data-theme="auto"] {
    --bg: #101819;
    --surface: #172224;
    --surface-2: #1d2b2d;
    --ink: #eaf5f5;
    --muted: #a9c0c2;
    --line: #34494c;
    --line-heavy: #789295;
    --accent: #83d7dc;
    --error-bg: #5d2727;
    --success-bg: #1d5530;
    --shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.45;
}
button, input { font: inherit; }
button { color: inherit; }

.shell { width: min(1160px, calc(100% - 32px)); margin-inline: auto; }
.site-header {
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
}
.header-row { min-height: 64px; display: flex; align-items: center; gap: 22px; }
.brand { font-size: 1.08rem; font-weight: 750; color: var(--ink); text-decoration: none; }
.nav { display: flex; gap: 16px; margin-right: auto; }
.nav a { color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--ink); }
.main { padding-block: 34px 50px; }
.title-row { display: flex; align-items: center; gap: 16px; }
h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 2.55rem); letter-spacing: -0.03em; }
h2 { margin: 24px 0 18px; font-size: 1.5rem; }
h3 { margin: 0 0 12px; font-size: 1.22rem; }

.trainer-grid {
  display: grid;
  grid-template-columns: minmax(340px, 1.05fr) minmax(210px, 0.72fr) minmax(280px, 0.95fr);
  column-gap: 64px;
  row-gap: 28px;
  align-items: start;
}
.question-column { min-width: 0; }
.score { margin-bottom: 10px; color: var(--muted); }

.pill {
  appearance: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  padding: 8px 16px;
  font-weight: 650;
  cursor: pointer;
  transition: transform 130ms ease, border-color 130ms ease, background 130ms ease;
}
.pill:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--line-heavy); }
.pill:disabled { opacity: 0.55; cursor: default; }
.pill.small { padding: 6px 13px; font-size: 0.9rem; }

.skewb-box {
  width: min(100%, 440px);
  margin-top: 15px;
  background: transparent;
}
.skewb-box svg { width: 100%; height: auto; display: block; overflow: visible; }

.answer-list { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.answer-button {
  width: 148px;
  text-align: center;
  appearance: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  padding: 8px 14px;
  font-weight: 650;
  cursor: pointer;
  transition: transform 130ms ease, border-color 130ms ease, background 90ms ease;
}
.answer-button:hover { transform: translateY(-1px); border-color: var(--line-heavy); }
.answer-button.error { background: var(--error-bg); }
.answer-button.correct { background: var(--success-bg); }

.option-line { display: block; margin: 4px 0; cursor: pointer; }
.option-line input { margin: 0 7px 0 0; accent-color: var(--accent); }
.option-spacer { height: 14px; }

.keybind-editor { margin-top: 12px; display: grid; gap: 7px; }
.keybind-row { display: grid; grid-template-columns: 72px 80px 70px; gap: 7px; align-items: center; font-size: 0.92rem; }
.keybind-key { color: var(--muted); }
.keybind-row .pill { padding: 5px 10px; font-size: 0.86rem; }
.keybind-editor[hidden] { display: none; }

.site-footer { border-top: 1px solid var(--line); color: var(--muted); padding: 22px 0 30px; font-size: 0.88rem; }

@media (max-width: 960px) {
  .trainer-grid { grid-template-columns: minmax(300px, 1fr) minmax(200px, .65fr); column-gap: 34px; }
  .options-column { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .shell { width: min(100% - 22px, 1160px); }
  .header-row { gap: 14px; }
  .trainer-grid { grid-template-columns: 1fr; }
  .answers-column, .options-column { grid-column: auto; }
  .answer-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
  .answer-button { width: 100%; }
  .skewb-box { width: 100%; max-width: 430px; }
}

</style>
</head>
<body>
  <header class="site-header">
    <div class="shell header-row">
      <a class="brand" href="#">Skewb Resources</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="#trainer">Trainer</a>
      </nav>
      <button id="themeButton" class="pill small" type="button" aria-label="Theme">Auto</button>
    </div>
  </header>

  <main id="trainer" class="shell main">
    <div class="title-row">
      <h1>Skewb Trainer</h1>
      <button id="muteButton" class="pill small" type="button">Mute</button>
    </div>

    <h2>EG2 Center Trainer</h2>

    <div class="trainer-grid">
      <section class="question-column" aria-label="Question">
        <div id="score" class="score">0/0 answered correctly</div>
        <button id="giveUpButton" class="pill" type="button">I give up</button>
        <div id="skewbMount" class="skewb-box" aria-label="Skewb center recognition question"></div>
      </section>

      <section class="answers-column" aria-label="Answers">
        <div id="answerButtons" class="answer-list"></div>
      </section>

      <section class="options-column" aria-label="Options">
        <form id="optionsForm">
          <h3>Options</h3>

          <label class="option-line"><input type="radio" name="trainerType" value="HorizontalU" checked /> Show Horizontal U centers (LFR)</label>
          <label class="option-line"><input type="radio" name="trainerType" value="O" /> Show O centers (FRU)</label>
          <label class="option-line"><input type="radio" name="trainerType" value="VerticalU" /> Show Vertical U centers (FUB)</label>
          <label class="option-line"><input type="radio" name="trainerType" value="Random" /> Show random centers subset</label>

          <div class="option-spacer"></div>
          <label class="option-line"><input id="showRightCornerColors" type="checkbox" checked /> Show Right Corner Colors</label>
          <label class="option-line"><input id="showAnswer" type="checkbox" /> Show Answer (reveal hidden corners & centers)</label>

          <div class="option-spacer"></div>
          <label class="option-line"><input type="radio" name="cubeOrientation" value="UpDown" checked /> Up-down Orientation</label>
          <label class="option-line"><input type="radio" name="cubeOrientation" value="Sideways" /> Sideways Orientation 1</label>
          <label class="option-line"><input type="radio" name="cubeOrientation" value="Sideways2" /> Sideways Orientation 2</label>

          <div class="option-spacer"></div>
          <button id="keybindToggle" class="pill" type="button">Show Keybinds</button>
          <div id="keybindEditor" class="keybind-editor" hidden></div>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="shell">EG2 trainer build · case order follows “EG2 Ori” left-to-right, top-to-bottom.</div>
  </footer>

  <script>
(() => {
  "use strict";

  // ---------- Constants ----------
  const COLORS = {
    Gray: "rgb(127,127,127)",
    Orange: "rgb(255,166,0)",
    Green: "rgb(0,255,0)",
    Yellow: "rgb(255,255,0)",
    White: "rgb(255,255,255)",
    Red: "rgb(255,0,0)",
    Blue: "rgb(0,0,255)",
  };

  const SHORT_TO_COLOR = {
    R: COLORS.Red,
    G: COLORS.Green,
    O: COLORS.Orange,
    B: COLORS.Blue,
    Y: COLORS.Yellow,
    W: COLORS.White,
    X: COLORS.Gray,
  };

  const COLOR_TO_SHORT = new Map(Object.entries(SHORT_TO_COLOR).map(([short, color]) => [color, short]));

  // Position order used throughout is [L, F, R, B, U].
  // These are the 16 EG2 Ori representatives in the exact order of the user's
  // reference image: left-to-right on row 1, then left-to-right on row 2.
  const EG2_REPRESENTATIVES = [
    "OBRGY", "GRBOY", "BGROY", "RYOGB",
    "OYRBG", "RYBOG", "ORBYG", "OYBGR",
    "ORYGB", "GBORY", "RYGBO", "ROYBG",
    "BORYG", "ROGYB", "BRGYO", "GOBYR",
  ];

  const EG2_NAMES = [
    "H",
    "Z",
    "U右",
    "斜左",
    "斜右",
    "上左",
    "上右",
    "N左",
    "N右",
    "U左",
    "V左",
    "V右",
    "下左",
    "下右",
    "無前",
    "無後",
  ];

  const TRAINER_TYPES = ["HorizontalU", "O", "VerticalU"];
  const ORIENTATIONS = ["UpDown", "Sideways", "Sideways2"];
  const CENTER_INDICES = { L: 4, F: 9, D: 14, U: 19, R: 24, B: 29 };
  const CASE_CENTER_INDICES = [CENTER_INDICES.L, CENTER_INDICES.F, CENTER_INDICES.R, CENTER_INDICES.B, CENTER_INDICES.U];
  const CORNER_INDICES = [
    0,1,2,3, 5,6,7,8, 10,11,12,13, 15,16,17,18, 20,21,22,23, 25,26,27,28,
  ];

  // Canonical EG2 corner frame from the source EG2 Ori image (case 132).
  // Face order here follows this renderer: L, F, D, U, R, B; each face is 4 corners + center.
  const EG2_CORNER_SHORT = [
    "O","R","O","R", null,
    "G","B","G","B", null,
    "W","W","W","W", null,
    "Y","Y","Y","Y", null,
    "R","O","R","O", null,
    "B","G","B","G", null,
  ];

  const DEFAULT_KEYBINDS = [
    "Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Digit6", "Digit7", "Digit8",
    "Digit9", "Digit0", "KeyQ", "KeyW", "KeyE", "KeyR", "KeyT", "KeyY",
  ];

  // Exact 30-sticker face order: L(0-4), F(5-9), D(10-14), U(15-19), R(20-24), B(25-29).
  // Coordinates mirror the original trainer renderer so changing orientation only changes layout,
  // never sticker meaning.
  const P = {
    UpDown: {
      translate: [10, 10],
      polys: [
        [[0,0],[1,1],[0,2]], [[1,1],[2,2],[2,4]], [[1,5],[2,4],[2,6]], [[0,2],[1,5],[0,4]], [[1,1],[2,4],[1,5],[0,2]],
        [[2,2],[3,3],[2,4]], [[3,3],[4,4],[4,6]], [[3,7],[4,6],[4,8]], [[2,4],[3,7],[2,6]], [[3,3],[4,6],[3,7],[2,4]],
        [[2,6],[3,7],[2,8]], [[3,7],[4,8],[4,10]], [[3,11],[4,10],[4,12]], [[2,8],[3,11],[2,10]], [[3,7],[4,10],[3,11],[2,8]],
        [[4,0],[5,1],[3,1]], [[5,1],[6,2],[5,3]], [[5,3],[4,4],[3,3]], [[3,3],[2,2],[3,1]], [[3,1],[5,1],[5,3],[3,3]],
        [[4,6],[4,4],[5,3]], [[6,2],[6,4],[5,3]], [[6,4],[6,6],[5,7]], [[5,7],[4,8],[4,6]], [[5,3],[6,4],[5,7],[4,6]],
        [[6,4],[6,2],[7,1]], [[8,0],[8,2],[7,1]], [[8,2],[8,4],[7,5]], [[7,5],[6,6],[6,4]], [[7,1],[8,2],[7,5],[6,4]],
      ],
    },
    Sideways: {
      translate: [10, 21],
      polys: [
        [[2,-2],[3,-1],[1,-1]], [[3,-1],[4,0],[3,1]], [[3,1],[2,2],[1,1]], [[1,1],[0,0],[1,-1]], [[1,-1],[3,-1],[3,1],[1,1]],
        [[4,0],[5,1],[3,1]], [[5,1],[6,2],[5,3]], [[5,3],[4,4],[3,3]], [[3,3],[2,2],[3,1]], [[3,1],[5,1],[5,3],[3,3]],
        [[2,2],[3,3],[2,4]], [[3,3],[4,4],[4,6]], [[3,7],[4,6],[4,8]], [[2,4],[3,7],[2,6]], [[3,3],[4,6],[3,7],[2,4]],
        [[8,2],[8,4],[7,5]], [[7,5],[6,6],[6,4]], [[6,4],[6,2],[7,1]], [[8,0],[8,2],[7,1]], [[7,1],[8,2],[7,5],[6,4]],
        [[6,2],[6,4],[5,3]], [[6,4],[6,6],[5,7]], [[5,7],[4,8],[4,6]], [[4,6],[4,4],[5,3]], [[5,3],[6,4],[5,7],[4,6]],
        [[6,6],[6,8],[5,7]], [[6,8],[6,10],[5,11]], [[5,11],[4,12],[4,10]], [[4,10],[4,8],[5,7]], [[5,7],[6,8],[5,11],[4,10]],
      ],
    },
    Sideways2: {
      translate: [10, 21],
      polys: [
        [[4,0],[5,1],[3,1]], [[5,1],[6,2],[5,3]], [[5,3],[4,4],[3,3]], [[3,3],[2,2],[3,1]], [[3,1],[5,1],[5,3],[3,3]],
        [[6,2],[6,4],[5,3]], [[6,4],[6,6],[5,7]], [[5,7],[4,8],[4,6]], [[4,6],[4,4],[5,3]], [[5,3],[6,4],[5,7],[4,6]],
        [[2,2],[3,3],[2,4]], [[3,3],[4,4],[4,6]], [[3,7],[4,6],[4,8]], [[2,4],[3,7],[2,6]], [[3,3],[4,6],[3,7],[2,4]],
        [[8,2],[8,4],[7,5]], [[7,5],[6,6],[6,4]], [[6,4],[6,2],[7,1]], [[8,0],[8,2],[7,1]], [[7,1],[8,2],[7,5],[6,4]],
        [[6,6],[6,8],[5,7]], [[6,8],[6,10],[5,11]], [[5,11],[4,12],[4,10]], [[4,10],[4,8],[5,7]], [[5,7],[6,8],[5,11],[4,10]],
        [[2,-2],[3,-1],[1,-1]], [[3,-1],[4,0],[3,1]], [[3,1],[2,2],[1,1]], [[1,1],[0,0],[1,-1]], [[1,-1],[3,-1],[3,1],[1,1]],
      ],
    },
  };

  // ---------- Small math / cube rotations ----------
  const mod = (a, b) => ((a % b) + b) % b;
  const sin90 = (n) => [0, 1, 0, -1][mod(n, 4)];
  const cos90 = (n) => [1, 0, -1, 0][mod(n, 4)];

  function rotationMatrix(axis, th) {
    const [x, y, z] = axis;
    const c = cos90(th), s = sin90(th), t = 1 - c;
    return [
      [x*x*t+c, x*y*t-z*s, x*z*t+y*s],
      [x*y*t+z*s, y*y*t+c, y*z*t-x*s],
      [x*z*t-y*s, y*z*t+x*s, z*z*t+c],
    ];
  }

  function mmul(a, b) {
    return a.map((row, i) => b[0].map((_, j) => row.reduce((sum, v, k) => sum + v * b[k][j], 0)));
  }

  function mvec(m, v) {
    return m.map((row) => row.reduce((sum, x, i) => sum + x * v[i], 0));
  }

  const RX = [0,1,2,3].map(n => rotationMatrix([1,0,0], n));
  const RY1 = rotationMatrix([0,1,0], 1);
  const RY2 = rotationMatrix([0,1,0], 2);
  const RY3 = rotationMatrix([0,1,0], 3);
  const RZ1 = rotationMatrix([0,0,1], 1);
  const RZ3 = rotationMatrix([0,0,1], 3);
  const CUBE_ROTATIONS = [
    RX[0], RX[1], RX[2], RX[3],
    RY1, mmul(RX[1], RY1), mmul(RX[2], RY1), mmul(RX[3], RY1),
    RY2, mmul(RX[1], RY2), mmul(RX[2], RY2), mmul(RX[3], RY2),
    RY3, mmul(RX[1], RY3), mmul(RX[2], RY3), mmul(RX[3], RY3),
    RZ1, mmul(RX[1], RZ1), mmul(RX[2], RZ1), mmul(RX[3], RZ1),
    RZ3, mmul(RX[1], RZ3), mmul(RX[2], RZ3), mmul(RX[3], RZ3),
  ];

  const COLOR_AXES = {
    [COLORS.White]: [0,-1,0],
    [COLORS.Red]: [-1,0,0],
    [COLORS.Green]: [0,0,1],
    [COLORS.Orange]: [1,0,0],
    [COLORS.Blue]: [0,0,-1],
    [COLORS.Yellow]: [0,1,0],
    [COLORS.Gray]: [0,0,0],
  };
  const AXIS_TO_COLOR = new Map(Object.entries(COLOR_AXES).map(([color, axis]) => [axis.join(","), color]));
  function rotateColor(color, rotation) {
    if (color === COLORS.Gray) return COLORS.Gray;
    return AXIS_TO_COLOR.get(mvec(rotation, COLOR_AXES[color]).join(","));
  }

  // ---------- EG2 full-state model & display-based classification ----------
  // The old build grouped center permutations by a center-only y conjugation. That is
  // valid for the highly symmetric NS solved layer, but not for directional EG2 corners.
  // In this build the EG2 corners define the coordinate frame. Every answer is derived
  // from the complete displayed cube state after undoing its whole-cube color rotation.

  const CANONICAL_CORNER_COLORS = EG2_CORNER_SHORT.map(v => v ? SHORT_TO_COLOR[v] : null);

  function makeCanonicalFullState(caseIndex) {
    const state = Array(30).fill(COLORS.Gray);
    for (const i of CORNER_INDICES) state[i] = CANONICAL_CORNER_COLORS[i];

    const rep = EG2_REPRESENTATIVES[caseIndex];
    state[CENTER_INDICES.L] = SHORT_TO_COLOR[rep[0]];
    state[CENTER_INDICES.F] = SHORT_TO_COLOR[rep[1]];
    state[CENTER_INDICES.R] = SHORT_TO_COLOR[rep[2]];
    state[CENTER_INDICES.B] = SHORT_TO_COLOR[rep[3]];
    state[CENTER_INDICES.U] = SHORT_TO_COLOR[rep[4]];
    state[CENTER_INDICES.D] = COLORS.White;
    return state;
  }

  function rotateState(state, rotation) {
    return state.map(c => rotateColor(c, rotation));
  }

  function cornerFrameMatches(state) {
    return CORNER_INDICES.every(i => state[i] === CANONICAL_CORNER_COLORS[i]);
  }

  function normalizeEG2State(rotatedFullState) {
    const matches = [];
    for (const candidate of CUBE_ROTATIONS) {
      const normalized = rotateState(rotatedFullState, candidate);
      if (cornerFrameMatches(normalized)) matches.push(normalized);
    }
    if (matches.length !== 1) {
      throw new Error(`EG2 corner-frame normalization expected 1 match, got ${matches.length}`);
    }
    return matches[0];
  }

  function centerSequenceFromState(normalizedState) {
    return CASE_CENTER_INDICES.map(i => COLOR_TO_SHORT.get(normalizedState[i])).join("");
  }

  function classifyDisplayedFullState(rotatedFullState) {
    const normalized = normalizeEG2State(rotatedFullState);
    if (normalized[CENTER_INDICES.D] !== COLORS.White) {
      throw new Error("EG2 normalization did not restore the white D center");
    }
    const seq = centerSequenceFromState(normalized);
    const caseIndex = EG2_REPRESENTATIVES.indexOf(seq);
    if (caseIndex < 0) throw new Error(`Unknown normalized EG2 center state: ${seq}`);
    return { caseIndex, normalized, sequence: seq };
  }

  function makeMaskedState(fullState, trainerType, showRightCornerColors, showAnswer) {
    if (showAnswer) return [...fullState];

    const state = Array(30).fill(COLORS.Gray);

    // Keep the bottom face exactly as the original NS trainer does.
    for (let i = 10; i <= 14; i++) state[i] = fullState[i];

    // Exactly three recognition centers, matching the original NS trainer subsets.
    if (trainerType === "HorizontalU") {
      state[CENTER_INDICES.L] = fullState[CENTER_INDICES.L];
      state[CENTER_INDICES.F] = fullState[CENTER_INDICES.F];
      state[CENTER_INDICES.R] = fullState[CENTER_INDICES.R];
      state[2] = fullState[2];
      state[3] = fullState[3];
    } else if (trainerType === "O") {
      state[CENTER_INDICES.F] = fullState[CENTER_INDICES.F];
      state[CENTER_INDICES.R] = fullState[CENTER_INDICES.R];
      state[CENTER_INDICES.U] = fullState[CENTER_INDICES.U];
    } else if (trainerType === "VerticalU") {
      state[CENTER_INDICES.F] = fullState[CENTER_INDICES.F];
      state[CENTER_INDICES.U] = fullState[CENTER_INDICES.U];
      state[CENTER_INDICES.B] = fullState[CENTER_INDICES.B];
    } else {
      throw new Error(`Unknown trainer type: ${trainerType}`);
    }

    // Same corner clues as the original NS center trainer, but with EG2 colors.
    state[7] = fullState[7];
    state[8] = fullState[8];
    if (showRightCornerColors) {
      state[22] = fullState[22];
      state[23] = fullState[23];
    }
    return state;
  }

  // ---------- Persistent settings ----------
  const STORAGE_KEY = "eg2-center-trainer-settings-v2";
  const KEYBIND_KEY = "eg2-center-trainer-keybinds-v1";
  const THEME_KEY = "eg2-center-trainer-theme-v1";

  const options = Object.assign({
    trainerType: "HorizontalU",
    showRightCornerColors: true,
    showAnswer: false,
    cubeOrientation: "UpDown",
  }, safeReadJSON(STORAGE_KEY, {}));

  let keybinds = safeReadJSON(KEYBIND_KEY, DEFAULT_KEYBINDS);
  if (!Array.isArray(keybinds) || keybinds.length !== 16) keybinds = [...DEFAULT_KEYBINDS];

  function safeReadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch { return fallback; }
  }
  function saveOptions() { localStorage.setItem(STORAGE_KEY, JSON.stringify(options)); }
  function saveKeybinds() { localStorage.setItem(KEYBIND_KEY, JSON.stringify(keybinds)); }

  // ---------- Trainer state ----------
  let currentQuestion = null;
  let correctQuestions = 0;
  let totalQuestions = 0;
  let wrongThisQuestion = new Set();
  let answeredCorrectCase = null;
  let muted = false;
  let keybindEditorOn = false;
  let editingCase = null;

  function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function generateQuestion() {
    const sourceCaseIndex = Math.floor(Math.random() * EG2_REPRESENTATIVES.length);
    const rotation = randomChoice(CUBE_ROTATIONS);
    const fullState = rotateState(makeCanonicalFullState(sourceCaseIndex), rotation);
    const derived = classifyDisplayedFullState(fullState);
    if (derived.caseIndex !== sourceCaseIndex) {
      throw new Error(`Generated EG2 case mismatch: source ${sourceCaseIndex}, displayed ${derived.caseIndex}`);
    }
    currentQuestion = {
      sourceCaseIndex,
      caseIndex: derived.caseIndex,
      rotation,
      fullState,
      randomTrainerType: randomChoice(TRAINER_TYPES),
    };
    wrongThisQuestion = new Set();
    renderAll();
  }

  function chosenTrainerType() {
    return options.trainerType === "Random" ? currentQuestion.randomTrainerType : options.trainerType;
  }

  function rendererState() {
    return makeMaskedState(
      currentQuestion.fullState,
      chosenTrainerType(),
      !!options.showRightCornerColors,
      !!options.showAnswer,
    );
  }

  // ---------- SVG renderer ----------
  function buildSVG(state) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 160 140");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "EG2 center recognition Skewb diagram");

    const xsc = Math.sqrt(3) * 10;
    const ysc = 10;
    const spec = P[options.cubeOrientation] || P.UpDown;
    const [tx, ty] = spec.translate;

    spec.polys.forEach((poly, i) => {
      const el = document.createElementNS(ns, "polygon");
      const pts = poly.map(([x,y]) => `${x * xsc + tx} ${y * ysc + ty}`).join(" ");
      el.setAttribute("points", pts);
      el.setAttribute("fill", state[i]);
      el.setAttribute("stroke", "black");
      el.setAttribute("stroke-width", "0.5");
      el.setAttribute("stroke-linejoin", "round");
      svg.appendChild(el);
    });
    return svg;
  }

  // ---------- UI ----------
  const els = {
    score: document.getElementById("score"),
    giveUpButton: document.getElementById("giveUpButton"),
    skewbMount: document.getElementById("skewbMount"),
    answerButtons: document.getElementById("answerButtons"),
    optionsForm: document.getElementById("optionsForm"),
    showRight: document.getElementById("showRightCornerColors"),
    showAnswer: document.getElementById("showAnswer"),
    muteButton: document.getElementById("muteButton"),
    themeButton: document.getElementById("themeButton"),
    keybindToggle: document.getElementById("keybindToggle"),
    keybindEditor: document.getElementById("keybindEditor"),
  };

  function renderAll() {
    renderScore();
    renderDiagram();
    renderAnswers();
    syncOptionsUI();
    renderKeybindEditor();
  }

  function renderScore() {
    els.score.textContent = `${correctQuestions}/${totalQuestions} answered correctly`;
  }

  function renderDiagram() {
    els.skewbMount.replaceChildren(buildSVG(rendererState()));
  }

  function renderAnswers() {
    els.answerButtons.replaceChildren();
    EG2_REPRESENTATIVES.forEach((_, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "answer-button";
      if (wrongThisQuestion.has(i)) btn.classList.add("error");
      if (answeredCorrectCase === i) btn.classList.add("correct");
      btn.textContent = EG2_NAMES[i];
      btn.title = `Reference case ${i + 1} (image order)`;
      btn.addEventListener("click", () => selectCase(i));
      els.answerButtons.appendChild(btn);
    });
  }

  function syncOptionsUI() {
    const trainerRadio = els.optionsForm.querySelector(`input[name="trainerType"][value="${options.trainerType}"]`);
    const orientationRadio = els.optionsForm.querySelector(`input[name="cubeOrientation"][value="${options.cubeOrientation}"]`);
    if (trainerRadio) trainerRadio.checked = true;
    if (orientationRadio) orientationRadio.checked = true;
    els.showRight.checked = !!options.showRightCornerColors;
    els.showAnswer.checked = !!options.showAnswer;
  }

  function humanKey(code) {
    return code.replace(/^(Key|Digit)/, "").replace("Space", "Space");
  }

  function renderKeybindEditor() {
    els.keybindEditor.hidden = !keybindEditorOn;
    els.keybindToggle.textContent = keybindEditorOn ? "Save Changes" : "Show Keybinds";
    if (!keybindEditorOn) { els.keybindEditor.replaceChildren(); return; }

    els.keybindEditor.replaceChildren();
    EG2_REPRESENTATIVES.forEach((_, i) => {
      const row = document.createElement("div");
      row.className = "keybind-row";
      const label = document.createElement("span");
      label.textContent = EG2_NAMES[i];
      const key = document.createElement("span");
      key.className = "keybind-key";
      key.textContent = `${humanKey(keybinds[i])} key`;
      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "pill";
      edit.textContent = editingCase === i ? "Press!" : "Edit";
      edit.disabled = editingCase !== null && editingCase !== i;
      edit.addEventListener("click", () => { editingCase = i; renderKeybindEditor(); edit.blur(); });
      row.append(label, key, edit);
      els.keybindEditor.appendChild(row);
    });
    const reset = document.createElement("button");
    reset.type = "button";
    reset.className = "pill";
    reset.textContent = "Reset Keybinds";
    reset.disabled = editingCase !== null;
    reset.addEventListener("click", () => { keybinds = [...DEFAULT_KEYBINDS]; saveKeybinds(); renderKeybindEditor(); });
    els.keybindEditor.appendChild(reset);
  }

  function selectCase(i) {
    if (keybindEditorOn) return;
    if (i === currentQuestion.caseIndex) {
      playTone(true);
      if (wrongThisQuestion.size === 0) {
        correctQuestions++;
        totalQuestions++;
      }
      answeredCorrectCase = i;
      generateQuestion();
      // Keep the just-correct answer highlighted for 300 ms, as in the original trainer.
      renderAnswers();
      setTimeout(() => { answeredCorrectCase = null; renderAnswers(); }, 300);
    } else {
      playTone(false);
      if (wrongThisQuestion.size === 0) totalQuestions++;
      wrongThisQuestion.add(i);
      answeredCorrectCase = null;
      renderScore();
      renderAnswers();
    }
  }

  function giveUp() {
    playTone(false);
    if (wrongThisQuestion.size === 0) totalQuestions++;
    for (let i = 0; i < 16; i++) if (i !== currentQuestion.caseIndex) wrongThisQuestion.add(i);
    answeredCorrectCase = null;
    renderScore();
    renderAnswers();
  }

  function playTone(correct) {
    if (muted) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = correct ? 660 : 180;
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (correct ? 0.12 : 0.18));
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + (correct ? 0.12 : 0.18));
      osc.addEventListener("ended", () => ctx.close());
    } catch { /* audio is optional */ }
  }

  // ---------- Events ----------
  els.giveUpButton.addEventListener("click", giveUp);

  els.optionsForm.addEventListener("change", (e) => {
    const t = e.target;
    if (t.name === "trainerType") options.trainerType = t.value;
    if (t.name === "cubeOrientation") options.cubeOrientation = t.value;
    if (t.id === "showRightCornerColors") options.showRightCornerColors = t.checked;
    if (t.id === "showAnswer") options.showAnswer = t.checked;
    saveOptions();
    renderDiagram();
  });

  els.muteButton.addEventListener("click", () => {
    muted = !muted;
    els.muteButton.textContent = muted ? "Unmute" : "Mute";
  });

  els.keybindToggle.addEventListener("click", () => {
    keybindEditorOn = !keybindEditorOn;
    editingCase = null;
    renderKeybindEditor();
    els.keybindToggle.blur();
  });

  document.addEventListener("keydown", (e) => {
    if (editingCase !== null) {
      e.preventDefault();
      const oldIndex = keybinds.indexOf(e.code);
      if (oldIndex >= 0 && oldIndex !== editingCase) {
        [keybinds[oldIndex], keybinds[editingCase]] = [keybinds[editingCase], keybinds[oldIndex]];
      } else {
        keybinds[editingCase] = e.code;
      }
      editingCase = null;
      saveKeybinds();
      renderKeybindEditor();
      return;
    }
    if (keybindEditorOn || e.repeat) return;
    const i = keybinds.indexOf(e.code);
    if (i >= 0) {
      e.preventDefault();
      selectCase(i);
    }
  });

  // Theme button: Auto -> Light -> Dark -> Auto.
  const themeModes = ["auto", "light", "dark"];
  let theme = localStorage.getItem(THEME_KEY) || "auto";
  if (!themeModes.includes(theme)) theme = "auto";
  function applyTheme() {
    document.documentElement.dataset.theme = theme;
    els.themeButton.textContent = theme[0].toUpperCase() + theme.slice(1);
    localStorage.setItem(THEME_KEY, theme);
  }
  els.themeButton.addEventListener("click", () => {
    theme = themeModes[(themeModes.indexOf(theme) + 1) % themeModes.length];
    applyTheme();
  });

  // ---------- Self-checks ----------
  function runSelfChecks() {
    const assert = (condition, message) => { if (!condition) throw new Error(`EG2 trainer self-check failed: ${message}`); };
    assert(CUBE_ROTATIONS.length === 24, "must have 24 cube rotations");
    assert(EG2_REPRESENTATIVES.length === 16, "must have 16 EG2 Ori cases");
    assert(new Set(EG2_REPRESENTATIVES).size === 16, "EG2 representatives must be unique");
    assert(new Set(EG2_NAMES).size === 16, "EG2 names must be unique");
    assert(ORIENTATIONS.every(o => P[o] && P[o].polys.length === 30), "all 3 renderer orientations must have 30 stickers");

    // Source EG2 Ori case 132: visible five-face SVG has centers U,F,R,B,L = Y,B,R,G,O
    // and corner groups U=YYYY, F=GBGB, R=RORO, B=BGBG, L=OROR.
    assert(EG2_REPRESENTATIVES[0] === "OBRGY", "case 132 / H center order must be L,F,R,B,U = OBRGY");
    assert(EG2_CORNER_SHORT.slice(0,4).join("") === "OROR", "L EG2 corners OROR");
    assert(EG2_CORNER_SHORT.slice(5,9).join("") === "GBGB", "F EG2 corners GBGB");
    assert(EG2_CORNER_SHORT.slice(10,14).join("") === "WWWW", "D EG2 corners WWWW");
    assert(EG2_CORNER_SHORT.slice(15,19).join("") === "YYYY", "U EG2 corners YYYY");
    assert(EG2_CORNER_SHORT.slice(20,24).join("") === "RORO", "R EG2 corners RORO");
    assert(EG2_CORNER_SHORT.slice(25,29).join("") === "BGBG", "B EG2 corners BGBG");

    const centerSets = {
      HorizontalU: [CENTER_INDICES.L, CENTER_INDICES.F, CENTER_INDICES.R],
      O: [CENTER_INDICES.F, CENTER_INDICES.R, CENTER_INDICES.U],
      VerticalU: [CENTER_INDICES.F, CENTER_INDICES.U, CENTER_INDICES.B],
    };
    assert(JSON.stringify(centerSets.HorizontalU) === JSON.stringify([4,9,24]), "LFR center placement");
    assert(JSON.stringify(centerSets.O) === JSON.stringify([9,24,19]), "FRU center placement");
    assert(JSON.stringify(centerSets.VerticalU) === JSON.stringify([9,19,29]), "FUB center placement");

    let fullStatesChecked = 0;
    let displayCombinationsChecked = 0;

    for (let caseIndex = 0; caseIndex < 16; caseIndex++) {
      const canonical = makeCanonicalFullState(caseIndex);
      assert(!canonical.includes(COLORS.Gray), `case ${caseIndex + 1} canonical answer must reveal all 30 stickers`);
      assert(classifyDisplayedFullState(canonical).caseIndex === caseIndex, `case ${caseIndex + 1} canonical classification`);

      for (const rotation of CUBE_ROTATIONS) {
        const fullState = rotateState(canonical, rotation);
        const derived = classifyDisplayedFullState(fullState);
        assert(derived.caseIndex === caseIndex, `case ${caseIndex + 1} classification survives a cube rotation`);
        assert(centerSequenceFromState(derived.normalized) === EG2_REPRESENTATIVES[caseIndex], `case ${caseIndex + 1} normalizes to source representative`);
        fullStatesChecked++;

        for (const trainerType of TRAINER_TYPES) {
          const hidden = makeMaskedState(fullState, trainerType, true, false);
          const shown = makeMaskedState(fullState, trainerType, true, true);

          // Reveal mode must be the exact full state, never a reconstructed approximation.
          assert(shown.every((c, i) => c === fullState[i]), `show answer reproduces full state for case ${caseIndex + 1}`);
          assert(!shown.includes(COLORS.Gray), `show answer contains no hidden stickers for case ${caseIndex + 1}`);

          // Hidden mode: top/U corners stay hidden, and exactly the requested 3 non-D centers are shown.
          assert([15,16,17,18].every(i => hidden[i] === COLORS.Gray), `${trainerType} hides U/top corners`);
          const wanted = new Set(centerSets[trainerType]);
          for (const idx of [CENTER_INDICES.L, CENTER_INDICES.F, CENTER_INDICES.R, CENTER_INDICES.B, CENTER_INDICES.U]) {
            assert((hidden[idx] !== COLORS.Gray) === wanted.has(idx), `${trainerType} exact 3-center mask at index ${idx}`);
          }
          assert(hidden[CENTER_INDICES.D] !== COLORS.Gray, `${trainerType} keeps bottom D center visible as in NS`);

          // Show Right Corner Colors only controls R-side bottom pair in hidden mode.
          const noRight = makeMaskedState(fullState, trainerType, false, false);
          assert(noRight[22] === COLORS.Gray && noRight[23] === COLORS.Gray, `${trainerType} hides R-side pair when option is off`);
          assert(hidden[22] !== COLORS.Gray && hidden[23] !== COLORS.Gray, `${trainerType} shows R-side pair when option is on`);

          for (const orientation of ORIENTATIONS) {
            assert(P[orientation].polys.length === hidden.length, `${orientation} renderer sticker count`);
            displayCombinationsChecked++;
          }
        }
      }
    }

    assert(fullStatesChecked === 16 * 24, `must verify 384 full case/rotation states, got ${fullStatesChecked}`);
    assert(displayCombinationsChecked === 16 * 24 * 3 * 3, `must verify 3456 case/rotation/subset/orientation combinations, got ${displayCombinationsChecked}`);

    window.EG2_DEBUG = {
      representatives: [...EG2_REPRESENTATIVES],
      names: [...EG2_NAMES],
      fullStatesChecked,
      displayCombinationsChecked,
      centerIndices: centerSets,
      sourceCase132Corners: { L: "OROR", F: "GBGB", D: "WWWW", U: "YYYY", R: "RORO", B: "BGBG" },
      classifier: "full displayed state -> EG2 corner-frame normalization -> exact 16-case center lookup",
    };
    console.info("EG2 Center Trainer exhaustive self-checks passed", window.EG2_DEBUG);
  }

  // ---------- Start ----------
  applyTheme();
  runSelfChecks();
  syncOptionsUI();
  generateQuestion();
})();

</script>
</body>
</html>
